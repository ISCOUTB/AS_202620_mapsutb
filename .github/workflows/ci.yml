name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud necesita el historial completo para el blame/new-code.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze

      # Análisis de dependencias (S13, amenaza T-03; ADR 0020): OSV-Scanner
      # contrasta las 85 versiones exactas de pubspec.lock con la base OSV
      # (avisos de GitHub y de pub.dev incluidos) y falla el pipeline si
      # alguna tiene una vulnerabilidad conocida. El binario se descarga de
      # la versión fija y se verifica su SHA-256 antes de ejecutarlo.
      - name: Análisis de dependencias — OSV-Scanner
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile pubspec.lock

      # Lo que el análisis anterior no ve: dependencias sin vulnerabilidad
      # conocida pero atrasadas. Informativo; las decisiones están en
      # docs/evidencia-s13.md.
      - name: Dependencias desactualizadas (informativo)
        run: flutter pub outdated --no-dev-dependencies

      # Taller de mensajes S12 (prototipo aislado, ADR 0019): las pruebas de
      # duplicado y de fallo recuperable se invocan con nombre para que el
      # run las deje citables. La suite completa las vuelve a correr.
      - name: Taller de mensajes — duplicado y fallo recuperable
        run: flutter test test/taller_mensajes_test.dart

      # Prueba de contrato (ficha S7, criterio 6): se invoca de forma
      # explícita y nombrada para que el run deje evidencia citable de que el
      # pipeline ejecuta específicamente las tres pruebas de contrato, no solo
      # "flutter test" en general.
      - name: Prueba de contrato (APIs externas)
        run: >
          flutter test
          test/geocoding_adapter_contract_test.dart
          test/static_map_adapter_contract_test.dart
          test/analytics_adapter_contract_test.dart

      # Suite completa + cobertura (genera coverage/lcov.info para SonarCloud).
      - name: Suite completa con cobertura
        run: flutter test --coverage

      # Medición del Escenario 6 (S14): pruebas del script que corta las
      # muestras de la sonda en ventanas de 7 días y calcula disponibilidad y p95.
      - name: Pruebas del análisis de disponibilidad (S14)
        run: python3 -m unittest discover -s scripts/medicion -v

      # Análisis estático auditable (ficha S7, criterio "Pipeline y análisis
      # estático"). Requiere el secret SONAR_TOKEN configurado en el repo.
      # La configuración (projectKey, organization, cobertura) vive en
      # sonar-project.properties.
      - name: Análisis estático — SonarCloud
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Falla el pipeline si el Quality Gate del proyecto no pasa, dejando el
      # resultado del análisis ligado al run de CI.
      - name: Quality Gate — SonarCloud
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

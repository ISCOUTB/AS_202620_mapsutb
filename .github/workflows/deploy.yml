name: Despliegue web (Firebase Hosting)

# Infraestructura como código del entorno público (ADR 0007): compila la
# app Flutter para web y la publica en Firebase Hosting (plan Spark, sin
# tarjeta). La configuración del hosting vive en firebase.json y el proyecto
# en .firebaserc. El entorno se recrea re-ejecutando este workflow.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: firebase-hosting
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

      # Secretos (ADR 0009): se toman del almacén de secrets del repositorio
      # y entran al build con --dart-define; nunca se versionan. Si un
      # secret no existe, la variable queda vacía y la app oculta la
      # función que depende de él (ver lib/core/config_apis.dart).
      - name: Compilar para web
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: >
          flutter build web --release
          --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
          --dart-define=GA_MEASUREMENT_ID="$GA_MEASUREMENT_ID"
          --dart-define=GA_API_SECRET="$GA_API_SECRET"

      # Health check estático: Firebase Hosting sirve solo estáticos, así
      # que la salud del despliegue es que este archivo responda 200 con el
      # commit desplegado (ver ADR 0007 y arc42 §7).
      - name: Generar health.json
        run: |
          printf '{"status":"ok","servicio":"mapsutb-web","commit":"%s","desplegado":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build/web/health.json
          cat build/web/health.json

      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Verificar URL y health check
        env:
          URL: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app/
        run: |
          for intento in 1 2 3 4 5 6; do
            if curl -fsS "${URL}health.json" | grep -q "$GITHUB_SHA"; then
              echo "Desplegado $GITHUB_SHA en $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL}health.json no respondió 200 con el commit $GITHUB_SHA"
          exit 1

# Logs estructurados: una línea JSON por petición (arc42 §8, observabilidad).
log_format json_mapsutb escape=json
  '{"ts":"$time_iso8601","nivel":"info","evento":"http_request",'
  '"metodo":"$request_method","ruta":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duracion_s":$request_time,'
  '"ip":"$remote_addr","user_agent":"$http_user_agent"}';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /dev/stdout json_mapsutb;

  # Health check: mismo contenido que /health.json de Firebase Hosting,
  # con el commit de la imagen en línea.
  location = /health {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /health.json =404;
  }

  # Flutter web es una SPA: cualquier ruta desconocida vuelve a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

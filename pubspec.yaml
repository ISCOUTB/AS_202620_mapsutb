name: mapsutb
description: >
  Mapa Interactivo de Ubicación con Recorrido 360°
  Esqueleto ejecutable de arquitectura (sin lógica de negocio).
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_svg: ^2.0.10
  circular_bottom_navigation: ^2.4.0
  google_fonts: ^6.2.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/zonas.json
    - assets/data/grafo.json
    - assets/icons/mapsutb_logo_WHITE.svg